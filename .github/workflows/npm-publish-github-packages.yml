# Runs the tests on every push to main and on pull requests.
# Publishes to npm (trusted publishing / OIDC, no token) only when a version tag "vX.Y.Z" is pushed:
#   npm version patch && git push --follow-tags
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

# Least privilege by default: jobs only get read access to the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to a full commit SHA (tags can be moved), the comment shows the version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # no dependency of the reporter needs install scripts
      - run: npm ci --ignore-scripts
      # the test project needs install scripts to download the Cypress binary
      - run: sh test/test.sh ci 0
      - run: sh test/test.sh test 16
      - run: sh test/test.sh "run moreTests" 16
      - run: sh test/test.sh "run requiredJiraKey" 104

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish to npm
    runs-on: ubuntu-latest
    # Protect this environment in Settings > Environments (required reviewers, tag rule "v*")
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      # nothing to build: publish without installing dependencies
      - name: Publish package
        run: npm publish
