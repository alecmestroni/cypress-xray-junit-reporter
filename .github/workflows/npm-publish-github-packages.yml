# This workflow will run tests using node and then publish a package to GitHub Packages on every push
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: sh test/test.sh ci
      - run: sh test/test.sh test
      - run: sh test/test.sh "run moreTests"
      - run: sh test/test.sh "run requiredJiraKey"
  publish-gpr:
    needs: build
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Publish package
        id: publish
        run: |
          npm publish
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: true
