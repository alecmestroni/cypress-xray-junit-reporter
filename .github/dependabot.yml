version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/test"
    schedule:
      interval: "weekly"
    groups:
      test-dependencies:
        patterns: ["*"]

  # keeps the SHA-pinned actions of the workflow up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
